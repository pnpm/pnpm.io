name: Build Test

on: [pull_request]

permissions:
  contents: read

env:
  COREPACK_ENABLE_AUTO_PIN: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/setup@v2
      - name: Install dependencies
        run: pnpm install
      - name: Build
        # Without the translations, which are not part of a pull request:
        # every locale is built from the English sources. The same command
        # .github/workflows/deploy.yml ships the site with.
        run: pnpm build
        env:
          # See .github/workflows/deploy.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that every URL of the site is still served
        run: pnpm check-urls
