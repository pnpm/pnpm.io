allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true

minimumReleaseAge: 0

publicHoistPattern:
  - '@mdx-js/react'
  - url-loader

registries:
  https://node-registry.bit.cloud:
    scopes:
      - '@pnpm'
      - '@bitdev'
      - '@bitdesign'
      - '@teambit'
    serverType: npm

packageExtensions:
  '@docusaurus/core':
    dependencies:
      prism-react-renderer: '*'
